networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  kafka-data:
  zookeeper-data:
  spark-data:
  airflow-site-packages:

services:
  # ===================== POSTGRES =====================
  postgres:
    image: postgres:15
    platform: linux/amd64
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    ports:
      - "127.0.0.1:5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:15
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    networks:
      - lakehouse-net
    entrypoint: >
      /bin/bash -c "
      if PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h postgres -U \"$POSTGRES_USER\" -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='airflow'\" | grep -q 1; then
        echo 'Airflow database already exists';
      else
        PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h postgres -U \"$POSTGRES_USER\" -d postgres -c 'CREATE DATABASE airflow;'
        echo 'Airflow database created';
      fi
      "
  # ===================== MINIO =====================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z 
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    networks:
      - lakehouse-net
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    #  interval: 30s
    #  timeout: 30s       
    #  retries: 10        
    #  start_period: 60s  

  # Инициализация MinIO
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\";
      mc mb myminio/lakehouse --ignore-existing;
      mc mb myminio/warehouse --ignore-existing;
      mc mb myminio/spark-events --ignore-existing;
      echo 'MinIO buckets created';
      "
    networks:
      - lakehouse-net

  # Инициализация таблиц Trino/Iceberg при старте инфраструктуры
  airflow-init-trino-tables:
    image: apache/airflow:2.10.3-python3.11
    container_name: airflow-init-trino-tables
    depends_on:
      minio-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
      airflow-standalone:
        condition: service_started
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${AIRFLOW_DB_NAME:?set AIRFLOW_DB_NAME in .env}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - PYTHONPATH=/home/airflow/.local/lib/python3.11/site-packages
      - AIRFLOW_DAG_ID=trino_tables_setup
      - TRINO_HEALTH_URL=http://trino:8080/v1/info
      - TRIGGER_POLL_INTERVAL=10
      - TRIGGER_TIMEOUT_SECONDS=900
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./mine_parser:/opt/airflow/mine_parser
    networks:
      - lakehouse-net
    restart: "no"
    command: |
      bash -lc "
      set -e
      echo 'Waiting for Airflow database and DAG registration...'
      until airflow db check >/dev/null 2>&1; do sleep 5; done
      until airflow dags list 2>/dev/null | grep -q 'trino_tables_setup'; do sleep 5; done
      if airflow dags list-import-errors 2>/dev/null | grep -q 'trino_tables'; then
        echo 'DAG import errors detected for trino_tables:'
        airflow dags list-import-errors || true
        exit 1
      fi
      python - <<'PY'
      from datetime import datetime, timezone
      import json
      import os
      import subprocess
      import time

      dag_id = os.getenv('AIRFLOW_DAG_ID', 'trino_tables_setup')
      poll = int(os.getenv('TRIGGER_POLL_INTERVAL', '10'))
      timeout = int(os.getenv('TRIGGER_TIMEOUT_SECONDS', '900'))
      started = time.time()
      payload = {
        'source': 'infra_startup',
        'triggered_by': 'airflow_init_trino_tables',
        'dag_id': dag_id,
      }
      attempt = 0

      while True:
        attempt += 1
        run_id = 'infra_startup_' + datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ') + f'_{attempt}'
        cmd = ['airflow', 'dags', 'trigger', dag_id, '--run-id', run_id, '--conf', json.dumps(payload, ensure_ascii=False)]
        result = subprocess.run(cmd, capture_output=True, text=True)

        if result.returncode == 0:
          print('Triggered', dag_id, 'via Airflow CLI')
          break

        stderr = result.stderr or ''
        stdout = result.stdout or ''
        dag_not_found = (
          'DagNotFound' in stderr
          or 'DagNotFound' in stdout
          or 'not found in DagModel' in stderr
          or 'not found in DagModel' in stdout
        )

        if dag_not_found:
          if time.time() - started > timeout:
            print('Timeout waiting for DAG registration in DagModel')
            print(stdout)
            print(stderr)
            raise SystemExit(1)
          print(f'DAG not in DagModel yet, retrying in {poll}s (attempt {attempt})')
          time.sleep(poll)
          continue

        print(stdout)
        print(stderr)
        raise SystemExit(result.returncode)
      PY
      echo 'Triggered trino_tables_setup via Airflow CLI'
      "

  # Инициализация Python-зависимостей Airflow
  airflow-init-deps:
    image: apache/airflow:2.10.3-python3.11
    container_name: airflow-init-deps
    volumes:
      - airflow-site-packages:/home/airflow/.local
    networks:
      - lakehouse-net
    restart: "no"
    command: >
      bash -lc "
      set -e;
      pip install trino minio mawo-natasha mawo-slovnet;
      echo 'Airflow Python dependencies installed';
      "

