  # ===================== NESSIE =====================
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    depends_on:
      - minio
      - postgres            # важно: дождаться БД
    environment:
      # Настройки хранения данных в MinIO (оставляем)
      QUARKUS_PROFILE: s3
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: $ {MINIO_ROOT_PASSWORD}
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://minio:9000
      QUARKUS_S3_PATH_STYLE_ACCESS: "true"
  
      # ПОСТОЯННОЕ ХРАНИЛИЩЕ МЕТАДАННЫХ через PostgreSQL
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Автоматическое создание схемы (при первом запуске)
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
  
      # Дополнительно: отключаем неиспользуемые профили
      QUARKUS_DATASOURCE_JDBC_MIN_SIZE: 1
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: 5
    ports:
      - "127.0.0.1:19120:19120"
    networks:
      - lakehouse-net

  # ===================== TRINO =====================
  trino:
    image: trinodb/trino:480
    container_name: trino
    depends_on:
      - nessie
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog
      - ./config/trino/catalog:/etc/trino/catalog/config.properties
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===================== SPARK MASTER =====================
  spark-master:
    image: spark:python3
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=1
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8083
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - spark-data:/bitnami
      - ./spark/conf:/opt/spark/conf
      - ./spark-apps:/opt/spark-apps
      - ./spark-jars/hadoop-aws-3.4.2.jar:/opt/spark/jars/hadoop-aws-3.4.2.jar
      - ./spark-jars/bundle-2.29.52.jar:/opt/spark/jars/bundle-2.29.52.jar
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:6066:6066"
      - "127.0.0.1:8083:8083"
    networks:
      - lakehouse-net
    command: >
      bash -lc "/opt/spark/sbin/start-master.sh"

  # ===================== SPARK WORKER 1 =====================
  spark-worker-1:
    image: spark:python3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=1
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark-apps:/opt/spark-apps
      - ./spark-jars/hadoop-aws-3.4.2.jar:/opt/spark/jars/hadoop-aws-3.4.2.jar
      - ./spark-jars/bundle-2.29.52.jar:/opt/spark/jars/bundle-2.29.52.jar
    ports:
      - "127.0.0.1:8084:8081"
    networks:
      - lakehouse-net
    command: >
      bash -lc "/opt/spark/sbin/start-worker.sh spark://spark-master:7077"

  # ===================== SPARK WORKER 2 =====================
  spark-worker-2:
    image: spark:python3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=1
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark-apps:/opt/spark-apps
      - ./spark-jars/hadoop-aws-3.4.2.jar:/opt/spark/jars/hadoop-aws-3.4.2.jar
      - ./spark-jars/bundle-2.29.52.jar:/opt/spark/jars/bundle-2.29.52.jar
    ports:
      - "127.0.0.1:8085:8081"
    networks:
      - lakehouse-net
    command: >
      bash -lc "/opt/spark/sbin/start-worker.sh spark://spark-master:7077"

  # ===================== SPARK HISTORY SERVER =====================
  spark-history-server:
    image: spark:python3
    container_name: spark-history-server
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=1
      - SPARK_CONF_DIR=/opt/spark/conf
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark-jars/hadoop-aws-3.4.2.jar:/opt/spark/jars/hadoop-aws-3.4.2.jar
      - ./spark-jars/bundle-2.29.52.jar:/opt/spark/jars/bundle-2.29.52.jar
    ports:
      - "127.0.0.1:18080:18080"
    networks:
      - lakehouse-net
    command: >
      bash -lc "/opt/spark/sbin/start-history-server.sh"

  # ===================== JUPYTER (для разработки Spark-приложений) =====================
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    depends_on:
      - spark-master
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER=spark://spark-master:7077
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - AWS_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark-jars:/home/jovyan/jars
      - ./mine_parser:/home/jovyan/mine_parser
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - lakehouse-net

  airflow-standalone:
    image: apache/airflow:2.10.3-python3.11
    container_name: airflow-standalone
    depends_on:
      airflow-init-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${AIRFLOW_DB_NAME:?set AIRFLOW_DB_NAME in .env}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - PYTHONPATH=/home/airflow/.local/lib/python3.11/site-packages
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USERNAME:?set AIRFLOW_ADMIN_USERNAME in .env}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      #- _PIP_ADDITIONAL_REQUIREMENTS=minio trino mawo-natasha mawo-slovnet
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/scripts:/opt/airflow/scripts
      - ./mine_parser:/opt/airflow/mine_parser
      - airflow-site-packages:/home/airflow/.local
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - lakehouse-net
    command: >
      bash -lc "
      rm -f /opt/airflow/airflow-webserver.pid /opt/airflow/airflow-scheduler.pid /opt/airflow/airflow-triggerer.pid;
      exec airflow standalone
      "
  nessie-db-init:
    image: postgres:15
    container_name: nessie-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - lakehouse-net
    entrypoint: >
      /bin/bash -c "
      PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h postgres -U \"$POSTGRES_USER\" -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='nessie'\" | grep -q 1 ||
      PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h postgres -U \"$POSTGRES_USER\" -d postgres -c \"CREATE DATABASE nessie\";
      echo 'Database nessie ready';
      "